<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>Damas</title>
<style>
:root{
  --bg:#4a2e1b; 
  --panel:#5c3a23; 
  --panel2:#73492d; 
  --text:#fcf8f2; 
  --muted:#e2cdbc;
  --accent:#c87431; 
  --danger:#c0392b; 
  --light:#f4e2c1; 
  --dark:#8c562e;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif}
body{overflow-x:hidden}
.screen{min-height:100svh;display:none;flex-direction:column;padding:16px 12px 20px}
.screen.active{display:flex}

.logo{
  width:128px;height:128px;
  display:flex;align-items:center;justify-content:center;
  margin:12px auto 10px;
  overflow:hidden;
  border-radius:20px;
  box-shadow:0 10px 20px rgba(0,0,0,0.4);
  background:transparent;
}
.logo img{
  display:block;
  width:100%;height:100%;
  object-fit:contain;
}

h1{text-align:center;font-size:32px;margin:4px 0 2px;letter-spacing:1px;font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,0.4)}
.subtitle{text-align:center;color:var(--muted);margin:0 0 20px;font-size:15px;font-weight:500}
.menu{width:100%;max-width:430px;margin:auto;display:flex;flex-direction:column;gap:12px}

button{
  border:0;border-radius:14px;padding:15px 18px;
  background: linear-gradient(180deg, #d88037 0%, #b35f21 100%);
  color:#fff;font-size:17px;font-weight:700;
  box-shadow:0 5px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
  cursor:pointer; transition: transform 0.1s ease, filter 0.15s ease;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
button:hover{filter: brightness(1.08)}
button:active{transform:scale(.97); filter: brightness(0.95)}
.secondary{background: linear-gradient(180deg, #855536 0%, #683f25 100%);}
.danger{background: linear-gradient(180deg, #d94335 0%, #a62a1e 100%);}

.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:48px;padding:10px 0;background:var(--panel2);font-size:28px;line-height:1}
.title{flex:1;text-align:center;font-size:22px;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,0.3)}
.spacer{width:48px}

.cards{width:100%;max-width:620px;margin:auto;display:grid;gap:12px}
.rule-card{text-align:left;background:var(--panel2);padding:15px;border-radius:14px;border:1px solid rgba(255,255,255,0.08)}
.rule-card strong{display:block;font-size:17px;margin-bottom:4px;color:#fff}
.rule-card small{color:var(--muted);font-size:13px;line-height:1.3}
.rule-card.selected{outline:3px solid #f39c12; background: #825333}

.note{text-align:center;color:var(--muted);font-size:14px;line-height:1.4;margin:10px auto;max-width:600px}
.rules{width:100%;max-width:720px;margin:0 auto;line-height:1.5;color:#f3e8df;background:var(--panel);padding:18px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.rules h2{font-size:20px;margin:12px 0 6px;color:#ffe4b5;border-bottom:1px solid rgba(255,255,255,0.15);padding-bottom:4px}
.rules h3{font-size:17px;margin:13px 0 4px;color:#fff}
.rules p{margin:6px 0}.rules ul{margin:6px 0 12px;padding-left:22px}.rules li{margin:5px 0}

.game{
  padding:8px 6px 20px;
  min-height:100svh;
  box-sizing:border-box;
  overflow-y:auto;
}
.game .top{padding:0 6px;margin-bottom:4px}
.turn{text-align:center;color:#ffe0c2;margin:2px 0 6px;font-size:17px;font-weight:600}

.board-wrap{
  width:min(96vw, calc(100svh - 230px), 980px);
  max-width:980px;
  margin:0 auto;
}
.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);
border:7px solid #3d2312;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,0.6)}

.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;user-select:none}
.light{background:var(--light); background-image: radial-gradient(circle at 50% 50%, #f7ea3, #e5cb9f);}
.dark{background:var(--dark); background-image: radial-gradient(circle at 50% 50%, #9e6337, #734320);}

.piece{
  width:82%;height:82%;border-radius:50%;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  transition: transform 0.15s ease-out;
  cursor:pointer;
}

.red{
  background: radial-gradient(circle at 35% 30%, #ff6b6b 0%, #d63031 55%, #8b0000 100%);
  border: 2px solid #630000;
  box-shadow: 
    0 6px 10px rgba(0,0,0,0.5), 
    inset 0 3px 5px rgba(255,255,255,0.45), 
    inset 0 -4px 6px rgba(0,0,0,0.5);
}
.red::before{
  content:''; position:absolute; inset:12%; border-radius:50%;
  border: 2px solid rgba(255, 255, 255, 0.25);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
}

.black{
  background: radial-gradient(circle at 35% 30%, #555555 0%, #222222 60%, #050505 100%);
  border: 2px solid #000000;
  box-shadow: 
    0 6px 10px rgba(0,0,0,0.6), 
    inset 0 3px 5px rgba(255,255,255,0.35), 
    inset 0 -4px 6px rgba(0,0,0,0.8);
}
.black::before{
  content:''; position:absolute; inset:12%; border-radius:50%;
  border: 2px solid rgba(255, 255, 255, 0.15);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
}

.king{overflow:hidden;}
.king:after{
  content:"♛";
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%,-53%);
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(18px, 5.5vw, 32px);
  line-height:1;
  color:#ffe066;
  text-shadow:0 2px 4px #000, 0 0 8px rgba(255, 215, 0, 0.8);
  z-index:2;
  pointer-events:none;
}

.selected{outline:4px solid #f39c12;outline-offset:-3px; z-index:5;}
.target:after{
  content:"";position:absolute;width:28%;height:28%;border-radius:50%;
  background:#2ecc71; box-shadow: 0 0 10px #2ecc71, inset 0 1px 2px rgba(255,255,255,0.8);
  animation: pulse 1.2s infinite alternate;
}
@keyframes pulse { from { transform: scale(0.85); opacity: 0.8; } to { transform: scale(1.15); opacity: 1; } }

.status{text-align:center;color:#ffe4cc;min-height:23px;margin:6px 0;font-weight:500}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding-bottom:4px}
.controls button{min-width:130px}

.modal{position:fixed;inset:0;background:rgba(20, 10, 5, 0.85);display:none;align-items:center;justify-content:center;padding:18px;z-index:100;backdrop-filter: blur(3px)}
.modal.show{display:flex}
.modal-box{background:#5c3a23;border:2px solid #8c562e;border-radius:20px;width:min(520px,100%);padding:22px;box-shadow:0 15px 50px rgba(0,0,0,0.7)}
.modal-box h2{text-align:center;margin:0 0 10px;color:#fff}.modal-box p{text-align:center;color:var(--muted);line-height:1.4}
.modal-buttons{display:flex;gap:12px;margin-top:18px}.modal-buttons button{flex:1}

@media(max-height:900px){
  .board-wrap{width:min(94vw,calc(100svh - 200px),900px)}
}
@media(max-height:700px){
  .logo{width:90px;height:90px}.menu{gap:8px}button{padding:12px}
  .game{padding-top:6px;padding-bottom:10px}
  .board-wrap{width:min(94vw,calc(100svh - 180px),760px)}
}


/* YouTube Playables compatibility layer */
.screen{min-height:100dvh}
.game{min-height:100dvh}
.board-wrap{width:min(96vw, 65dvh, 980px)}
@media(max-height:700px){.board-wrap{width:min(94vw, 65dvh, 760px)}}
button,.cell{touch-action:manipulation}
.loading-screen{align-items:center;justify-content:center;text-align:center}
.loading-content{display:flex;flex-direction:column;align-items:center;gap:14px}
.loading-content h1{margin:0}
.loading-content p{margin:0;color:var(--muted);font-size:15px}
.loading-spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);border-top-color:#f2b36f;border-radius:50%;animation:playablesSpin .8s linear infinite}
@keyframes playablesSpin{to{transform:rotate(360deg)}}
body.yt-paused,body.yt-paused *{pointer-events:none!important;animation-play-state:paused!important;transition:none!important}
.cell:focus-visible{outline:3px solid #fff36b;outline-offset:-4px;z-index:6}
</style>
</head>

function normalizeLanguage(tag){

  for(const candidate of candidates){

}

function audioReady(){
  try{
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }catch(e){return null}
}

function tone(f,d,t='sine',v=.06,delay=0){
  if(!audioEnabled || gamePaused)return;
  const c=audioReady();
  if(!c)return;
  try{
    const o=c.createOscillator(),g=c.createGain();
    o.type=t;o.frequency.setValueAtTime(f,c.currentTime+delay);
    g.gain.setValueAtTime(.0001,c.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(v,c.currentTime+delay+.015);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+d);
    o.connect(g);g.connect(c.destination);
    o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.03);
  }catch(e){}
}

function playCaptureSound(){
  if(!audioEnabled || gamePaused) return;
  const c=audioReady();
  if(!c) return;
  try{
    const notes = [392.00, 493.88, 587.33]; 
    notes.forEach((freq, idx) => {
      const o = c.createOscillator();
      const g = c.createGain();
      const delay = idx * 0.05;
      
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq, c.currentTime + delay);
      
      g.gain.setValueAtTime(0.0001, c.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.12, c.currentTime + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + delay + 0.22);
      
      o.connect(g);
      g.connect(c.destination);
      
      o.start(c.currentTime + delay);
      o.stop(c.currentTime + delay + 0.25);
    });
  }catch(e){}
}

function sfx(n){
  if(!audioEnabled || gamePaused)return;
  if(n==='click')tone(580,.07,'sine',.08);
  if(n==='move')tone(360,.11,'triangle',.08);
  if(n==='capture')playCaptureSound();
  if(n==='king'){tone(440,.12,'triangle',.08);tone(660,.15,'triangle',.08,.12);tone(880,.22,'triangle',.08,.25)}
  if(n==='win'){tone(523,.16,'triangle',.09);tone(659,.16,'triangle',.09,.15);tone(784,.28,'triangle',.09,.30)}
  if(n==='lose'){tone(330,.20,'sine',.08);tone(247,.30,'sine',.07,.18)}
}

function armGameTask(task, delay){
  task.remaining=Math.max(0,delay);
  task.due=Date.now()+task.remaining;
  task.timer=setTimeout(()=>{
    task.timer=null;
    gameTimers.delete(task);
    if(gamePaused){task.remaining=0;gameTimers.add(task);return;}
    task.callback();
  },task.remaining);
}
function scheduleGameTask(callback, delay){
  const task={callback,remaining:delay,timer:null,due:0};
  gameTimers.add(task);
  if(!gamePaused)armGameTask(task,delay);
  return task;
}
function pauseGameTasks(){
  gamePaused=true;
  gameTimers.forEach(task=>{
    if(task.timer!==null){
      clearTimeout(task.timer);
      task.timer=null;
      task.remaining=Math.max(0,task.due-Date.now());
    }
  });
}
function resumeGameTasks(){
  gamePaused=false;
  Array.from(gameTimers).forEach(task=>{
    if(task.timer===null)armGameTask(task,task.remaining||0);
  });
}
function pausePlayable(){
  pauseGameTasks();
  document.body.classList.add('yt-paused');
  try{if(audioCtx && audioCtx.state==='running')audioCtx.suspend().catch(()=>{})}catch(e){}
  saveGameState();
}
function resumePlayable(){
  document.body.classList.remove('yt-paused');
  resumeGameTasks();
  try{if(audioEnabled && audioCtx && audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}catch(e){}
}
function serializeGameState(){
  return JSON.stringify({
    schemaVersion:1,
    ruleKey:'brazil',
    languagePreference:languageWasManuallySelected?lang:null,
    board:board.map(row=>row.map(p=>p?{color:p.color,king:!!p.king}:null)),
    turn,mode,level,aiColor,
    selected:selected?{r:selected.r,c:selected.c}:null

}
function saveGameState(){
  if(!inPlayables || !cloudSaveReady || !window.ytgame?.game?.saveData || !board.length)return Promise.resolve();
  let payload;
  try{payload=serializeGameState()}catch(e){logPlayableWarning();return Promise.resolve();}
  if(payload.length>3*1024*1024){logPlayableWarning();return Promise.resolve();}
  cloudSaveQueue=cloudSaveQueue.catch(()=>{}).then(()=>window.ytgame.game.saveData(payload)).catch(()=>{logPlayableWarning();});
  return cloudSaveQueue;
}
function restoreGameState(raw){
  if(!raw || typeof raw!=='string')return false;
  try{
    const data=JSON.parse(raw);
    if(!data || !Array.isArray(data.board) || data.board.length!==8 || data.board.some(row=>!Array.isArray(row)||row.length!==8))return false;
    const restored=data.board.map(row=>row.map(p=>{
      if(p===null)return null;
      if(!p || !['red','black'].includes(p.color))throw new Error('Peça inválida');
      return {color:p.color,king:!!p.king};
    }));
    if(!['red','black'].includes(data.turn))return false;
    if(!['ai','friend'].includes(data.mode))return false;
    if(!['easy','medium','hard'].includes(data.level))return false;
    const restoredLanguage=normalizeLanguage(data.languagePreference);
    if(restoredLanguage){lang=restoredLanguage;languageWasManuallySelected=true;saveLanguagePreference(lang);}
    board=restored;
    ruleKey='brazil';R=RULES.brazil;
    turn=data.turn;mode=data.mode;level=data.level;
    aiColor=data.aiColor==='red'?'red':'black';
    selected=null;
    if(data.selected && Number.isInteger(data.selected.r) && Number.isInteger(data.selected.c) && data.selected.r>=0 && data.selected.r<8 && data.selected.c>=0 && data.selected.c<8){
      const piece=board[data.selected.r][data.selected.c];
      if(piece && piece.color===turn)selected={r:data.selected.r,c:data.selected.c};
    }
    aiLastMove=null;
    render();setStatus();
    return true;
  }catch(e){logPlayableWarning();return false;}
}
function normalizePlayableLanguage(tag){

}
function nextFrame(){return new Promise(resolve=>requestAnimationFrame(()=>resolve()));}
function setupPlayableSystem(sdk){
  try{audioEnabled=!!sdk.system.isAudioEnabled()}catch(e){audioEnabled=true;}
  try{sdk.system.onAudioEnabledChange(enabled=>{
    audioEnabled=!!enabled;
    if(!audioEnabled && audioCtx && audioCtx.state==='running')audioCtx.suspend().catch(()=>{});
  })}catch(e){logPlayableWarning();}
  try{sdk.system.onPause(()=>pausePlayable())}catch(e){logPlayableWarning();}
  try{sdk.system.onResume(()=>resumePlayable())}catch(e){logPlayableWarning();}

async function bootGame(){
  show('loading');
  const sdk=window.ytgame;
  inPlayables=!!(sdk && sdk.IN_PLAYABLES_ENV);

  }
  let savedData=null;

  lang='en';
  if(inPlayables){

    try{lang=normalizeLanguage(await sdk.system.getLanguage())||detectLang()}catch(e){lang=detectLang();logPlayableWarning();}
    try{savedData=await sdk.game.loadData();cloudSaveReady=true;}catch(e){cloudSaveReady=false;logPlayableWarning();}
  }else{

  const savedLanguage=loadLanguagePreference();

  setRule('brazil');
  applyLang();
  const resumed=cloudSaveReady && restoreGameState(savedData);
  if(resumed){

    if(turn==='red' && selected===null)setStatus();

    show('home');

  await nextFrame();
  if(sdk?.game?.gameReady){try{sdk.game.gameReady()}catch(e){logPlayableWarning();}}
}

function render(){

  cell.onclick=()=>tap(r,c);
  cell.onkeydown=(ev)=>{
    if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();tap(r,c);}
    else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();const delta=ev.key==='ArrowUp'?[-1,0]:ev.key==='ArrowDown'?[1,0]:ev.key==='ArrowLeft'?[0,-1]:[0,1];const nr=Math.max(0,Math.min(R.n-1,r+delta[0])),nc=Math.max(0,Math.min(R.n-1,c+delta[1]));el.children[nr*R.n+nc]?.focus();}

function getMoves(r,c,captureOnly=false){
 const p=board[r]?.[c];
 if(!p)return[];

 const moves=[];
 const captureMoves=[];
 const forward=p.color==='red'?-1:1;
 const forwardDirs=[[forward,-1],[forward,1]];
 const allDirs=[[ -1,-1],[-1,1],[1,-1],[1,1]];
 const moveDirs=p.king?allDirs:forwardDirs;

 const captureDirs=p.king?allDirs:(R.backCapture?allDirs:forwardDirs);

 if(p.king && R.flying){
   for(const [dr,dc] of allDirs){
     let step=1, enemy=null;
     while(true){
       const nr=r+dr*step,nc=c+dc*step;
       if(nr<0||nr>=R.n||nc<0||nc>=R.n)break;
       const target=board[nr][nc];

       if(!enemy){
         if(!target){
           if(!captureOnly)moves.push({r:nr,c:nc,capture:null});
         }else if(target.color!==p.color){
           enemy={r:nr,c:nc};
         }else break;
       }else{
         if(!target){
           captureMoves.push({r:nr,c:nc,capture:enemy});
         }else break;
       }
       step++;
     }
   }
 }else{
   for(const [dr,dc] of captureDirs){
     const mr=r+dr,mc=c+dc;
     const lr=r+2*dr,lc=c+2*dc;
     if(lr<0||lr>=R.n||lc<0||lc>=R.n||mr<0||mr>=R.n||mc<0||mc>=R.n)continue;

     const middle=board[mr][mc];
     const landing=board[lr][lc];

     if(middle && middle.color!==p.color && !landing){
       if(R.noManCaptureKing && !p.king && middle.king)continue;
       captureMoves.push({r:lr,c:lc,capture:{r:mr,c:mc}});
     }
   }

   if(!captureOnly){
     for(const [dr,dc] of moveDirs){
       const nr=r+dr,nc=c+dc;
       if(nr>=0&&nr<R.n&&nc>=0&&nc<R.n&&!board[nr][nc]){
         moves.push({r:nr,c:nc,capture:null});
       }
     }
   }
 }

 return captureMoves.length?captureMoves:moves;
}

function captureProfile(r,c){
 let best={count:0,kings:0,firstKing:999,startKing:!!board[r]?.[c]?.king};
 function better(a,b){
  if(a.count!==b.count)return a.count>b.count;
  if(ruleKey==='spanish'){
   if(a.kings!==b.kings)return a.kings>b.kings;
   return a.firstKing<b.firstKing;
  }
  if(ruleKey==='italian'){
   if(a.startKing!==b.startKing)return a.startKing>b.startKing;
   if(a.kings!==b.kings)return a.kings>b.kings;
   return a.firstKing<b.firstKing;
  }
  return false;
 }
 function dfs(sr,sc,depth,seen,kings,firstKing){
  const moves=getMoves(sr,sc,true).filter(m=>m.capture&&!seen.has(m.capture.r+','+m.capture.c));
  if(!moves.length){
   const leaf={count:depth,kings,firstKing,startKing:best.startKing};
   if(better(leaf,best))best=leaf;
   return;
  }
  for(const m of moves){
   const p=board[sr][sc],taken=board[m.capture.r][m.capture.c];
   const wasKing=p.king, takenKing=!!taken?.king;
   board[sr][sc]=null; board[m.capture.r][m.capture.c]=null; board[m.r][m.c]=p;

   const promote=(p.color==='red'?m.r===0:m.r===R.n-1);
   let becameKing=false;
   if(promote&&!p.king&&!R.promotionEnd){p.king=true;becameKing=true;}

   const key=m.capture.r+','+m.capture.c;
   seen.add(key);
   const nextKings=kings+(takenKing?1:0);
   const nextFirst=(takenKing&&firstKing===999)?depth+1:firstKing;

   if(becameKing && ruleKey!=='russian'){
    const leaf={count:depth+1,kings:nextKings,firstKing:nextFirst,startKing:best.startKing};
    if(better(leaf,best))best=leaf;
   }else{
    dfs(m.r,m.c,depth+1,seen,nextKings,nextFirst);
   }

   seen.delete(key);
   p.king=wasKing;
   board[m.r][m.c]=null;
   board[sr][sc]=p;
   board[m.capture.r][m.capture.c]=taken;
  }
 }
 dfs(r,c,0,new Set(),0,999);
 return best;
}

function captureSequences(r,c){ return captureProfile(r,c).count; }

function allCaptures(color){
  const candidates=[];
  for(let r=0;r<R.n;r++)for(let c=0;c<R.n;c++)if(board[r][c]?.color===color){
    const ms=getMoves(r,c,true).filter(m=>m.capture);
    const profile=R.majority?captureProfile(r,c):null;
    ms.forEach(m=>candidates.push({
      from:{r,c},...m,
      score:profile?profile.count:1,
      kings:profile?profile.kings:0,
      firstKing:profile?profile.firstKing:999,
      startKing:profile?profile.startKing:!!board[r][c]?.king
    }));
  }
  if(R.majority&&candidates.length){
    const max=Math.max(...candidates.map(x=>x.score));
    let best=candidates.filter(x=>x.score===max);

    if(ruleKey==='spanish'){
      const maxKings=Math.max(...best.map(x=>x.kings));
      best=best.filter(x=>x.kings===maxKings);
      const minFirst=Math.min(...best.map(x=>x.firstKing));
      best=best.filter(x=>x.firstKing===minFirst);
    }

    if(ruleKey==='italian'){
      const kingMoves=best.filter(x=>x.startKing);
      if(kingMoves.length)best=kingMoves;
      const maxKings=Math.max(...best.map(x=>x.kings));
      best=best.filter(x=>x.kings===maxKings);
      const minFirst=Math.min(...best.map(x=>x.firstKing));
      best=best.filter(x=>x.firstKing===minFirst);
    }
    return best;
  }
  return candidates;
}

function tap(r,c){
 if(gamePaused || (mode==='ai'&&turn===aiColor))return;
 const p=board[r][c];
 if(selected){
  const legal=getMoves(selected.r,selected.c);
  const m=legal.find(x=>x.r===r&&x.c===c);
  if(m){
   const all=allCaptures(turn);
   if(all.length && !m.capture)return;
   if(all.length && R.majority){
    const ok=all.some(x=>x.from.r===selected.r&&x.from.c===selected.c&&x.r===r&&x.c===c);
    if(!ok)return;
   }
   movePiece(selected.r,selected.c,m);return;
  }
 }
 if(p&&p.color===turn){
  const caps=allCaptures(turn);
  let moves=getMoves(r,c,caps.length>0);
  if(caps.length&&R.majority)moves=moves.filter(m=>caps.some(x=>x.from.r===r&&x.from.c===c&&x.r===m.r&&x.c===m.c));
  if(moves.length){selected={r,c};render();setStatus(t('chooseSquare'))}
 }
}

function movePiece(fr,fc,m){
  const p=board[fr][fc];board[fr][fc]=null;board[m.r][m.c]=p;
  if(m.capture)board[m.capture.r][m.capture.c]=null;
  sfx(m.capture?'capture':'move');

  const promote=(p.color==='red'?m.r===0:m.r===R.n-1);
  const promotedDuringCapture=!!m.capture && promote && !p.king && !R.promotionEnd;

  if(promote&&!p.king&&!R.promotionEnd){p.king=true;sfx('king');}

  if(m.capture){
    const more=getMoves(m.r,m.c,true).filter(x=>x.capture);
    if(more.length && !(promotedDuringCapture&&ruleKey!=='russian')){
      selected={r:m.r,c:m.c};render();setStatus(t('nextCapture'));
      saveGameState();
      if(mode==='ai'&&turn===aiColor)scheduleGameTask(aiMove,180);
      return;
    }
  }

  if(promote&&!p.king&&R.promotionEnd){p.king=true;sfx('king');}
  selected=null;turn=turn==='red'?'black':'red';render();setStatus();checkEnd();
  saveGameState();
  if(mode==='ai'&&turn===aiColor)scheduleGameTask(aiMove,180);
}

function legalAIMoves(color){
 const caps=allCaptures(color);
 if(caps.length)return caps;
 const a=[];
 for(let r=0;r<R.n;r++)for(let c=0;c<R.n;c++)if(board[r][c]?.color===color)
  getMoves(r,c,false).forEach(m=>a.push({from:{r,c},...m}));
 return a;
}

function aiMove(){
 if(gamePaused)return;
 const moves=legalAIMoves(aiColor);if(!moves.length){checkEnd();return}

 if(level==='easy'){
   const chosen=moves[Math.floor(Math.random()*moves.length)];
   aiLastMove={from:{r:chosen.from.r,c:chosen.from.c},to:{r:chosen.r,c:chosen.c}};
   movePiece(chosen.from.r,chosen.from.c,chosen);
   return;
 }
 if(level==='medium'){
   function applyTemp(m){
    const p=board[m.from.r][m.from.c],oldTo=board[m.r][m.c];
    const oldCap=m.capture?board[m.capture.r][m.capture.c]:null,oldKing=p.king;
    board[m.from.r][m.from.c]=null;if(m.capture)board[m.capture.r][m.capture.c]=null;
    board[m.r][m.c]=p;
    const promote=(p.color==='red'?m.r===0:m.r===R.n-1);
    if(promote&&!p.king&&!R.promotionEnd)p.king=true;
    return ()=>{p.king=oldKing;board[m.from.r][m.from.c]=p;board[m.r][m.c]=oldTo;if(m.capture)board[m.capture.r][m.capture.c]=oldCap;};
   }
   function ev(color){
    const other=color==='red'?'black':'red';let s=0,mi=0,op=0;
    for(let r=0;r<R.n;r++)for(let c=0;c<R.n;c++){const p=board[r][c];if(!p)continue;const v=p.king?230:100;
      if(p.color===color){mi++;s+=v;s+=(color==='red'?(R.n-1-r):r)*5;if(c>0&&c<R.n-1)s+=4;}
      else{op++;s-=v;s-=(color==='red'?r:(R.n-1-r))*3;}
    }
    if(!mi)return -1000000;if(!op)return 1000000;
    s+=(legalAIMoves(color).length-legalAIMoves(other).length)*20;return s;
   }
   const mm=(d,max,a,b)=>{
    if(d<=0)return ev(aiColor);const col=max?aiColor:(aiColor==='red'?'black':'red'),ls=legalAIMoves(col);
    if(!ls.length)return max?-1000000:1000000;let best=max?-Infinity:Infinity;
    for(const m of ls){const p=board[m.from.r][m.from.c],k=p.king;const u=applyTemp(m);let v=mm(d-1,!max,a,b);if(m.capture)v+=max?90:-90;if(!k&&p.king)v+=max?180:-180;u();
      if(max){best=Math.max(best,v);a=Math.max(a,best)}else{best=Math.min(best,v);b=Math.min(b,best)}if(b<=a)break;}
    return best;
   };
   const ranked=moves.map(m=>{const u=applyTemp(m),s=mm(2,false,-Infinity,Infinity)+(m.capture?260:0);u();return{m,score:s}}).sort((a,b)=>b.score-a.score);
   const top=ranked.slice(0,Math.min(2,ranked.length)),chosen=top[Math.floor(Math.random()*top.length)].m;
   aiLastMove={from:{r:chosen.from.r,c:chosen.from.c},to:{r:chosen.r,c:chosen.c}};movePiece(chosen.from.r,chosen.from.c,chosen);return;
 }

 const POSITION_WEIGHTS=[
  [0,4,0,4,0,4,0,4],[3,0,3,0,3,0,3,0],
  [0,3,0,5,0,3,0,2],[2,0,5,0,6,0,3,0],
  [0,3,0,6,0,5,0,2],[2,0,3,0,5,0,3,0],
  [0,3,0,3,0,3,0,3],[4,0,4,0,4,0,4,0]
 ];
 const opponent=aiColor==='red'?'black':'red';
 function cloneBoard(){return board.map(row=>row.map(p=>p?{color:p.color,king:p.king}:null));}
 function restoreBoard(st){board=st.map(row=>row.map(p=>p?{color:p.color,king:p.king}:null));}
 function applyTemp(m){
   const snapshot=cloneBoard();
   const p=board[m.from.r][m.from.c];
   board[m.from.r][m.from.c]=null;
   if(m.capture)board[m.capture.r][m.capture.c]=null;
   board[m.r][m.c]=p;
   const promote=(p.color==='red'?m.r===0:m.r===R.n-1);
   if(promote&&!p.king&&!R.promotionEnd)p.king=true;
   return snapshot;
 }
 function evaluateBoardMaster(){
   let score=0,my=0,opp=0,myKings=0,oppKings=0;
   for(let r=0;r<R.n;r++)for(let c=0;c<R.n;c++){
     const p=board[r][c]; if(!p)continue;
     const mine=p.color===aiColor;
     let v=p.king?250:100;
     if(p.king){v+=70; mine?myKings++:oppKings++;}
     else v+=(aiColor==='red'?(R.n-1-r):r)*6;
     v+=POSITION_WEIGHTS[r][c]||0;
     let protect=0;
     for(const d of [[-1,-1],[-1,1],[1,-1],[1,1]]){
       const q=board[r+d[0]]?.[c+d[1]];
       if(q&&q.color===p.color)protect++;
     }
     v+=protect*(p.king?14:9);
     if(!p.king && (aiColor==='red'?r<=1:r>=R.n-2)) v+=35;
     score+=mine?v:-v; mine?my++:opp++;
   }
   if(!opp)return 10000000;
   if(!my)return -10000000;
   const myMoves=legalAIMoves(aiColor).length;
   const opMoves=legalAIMoves(opponent).length;
   score+=(myMoves-opMoves)*45;
   score+=(myKings-oppKings)*55;
   if(myMoves===0)score-=500000;
   if(opMoves===0)score+=500000;
   return score;
 }
 function minimaxMaster(depth,alpha,beta,maximizing){
   const color=maximizing?aiColor:opponent;
   const moves=legalAIMoves(color);
   if(depth<=0)return {score:evaluateBoardMaster()};
   if(!moves.length)return {score:maximizing?-10000000:10000000};
   moves.sort((a,b)=>((b.capture?1:0)-(a.capture?1:0)));
   let bestMove=moves[0];
   if(maximizing){
     let best=-Infinity;
     for(const m of moves){
       const snap=applyTemp(m);
       let value;
       const more=m.capture?getMoves(m.r,m.c,true).filter(x=>x.capture).length>0:false;
       value=minimaxMaster(more?depth:depth-1,alpha,beta,!more?false:true);
       let sc=value.score+(m.capture?120:0);
       if(!m.capture&&board[m.r][m.c]?.king)sc+=90;
       restoreBoard(snap);
       if(sc>best){best=sc;bestMove=m;}
       alpha=Math.max(alpha,best);
       if(beta<=alpha)break;
     }
     return {score:best,move:bestMove};
   }else{
     let best=Infinity;
     for(const m of moves){
       const snap=applyTemp(m);
       const more=m.capture?getMoves(m.r,m.c,true).filter(x=>x.capture).length>0:false;
       const value=minimaxMaster(more?depth:depth-1,alpha,beta,more?false:true);
       const sc=value.score-(m.capture?120:0);
       restoreBoard(snap);
       if(sc<best){best=sc;bestMove=m;}
       beta=Math.min(beta,best);
       if(beta<=alpha)break;
     }
     return {score:best,move:bestMove};
   }
 }
 const pieceCount=board.flat().filter(Boolean).length;
 const AI_DEPTH=pieceCount<=8?7:(pieceCount<=12?6:5);
 const result=minimaxMaster(AI_DEPTH,-Infinity,Infinity,true);
 const chosen=result.move||moves[0];
 aiLastMove={from:{r:chosen.from.r,c:chosen.from.c},to:{r:chosen.r,c:chosen.c}};
 aiLastMove.to={r:chosen.r,c:chosen.c};
 movePiece(chosen.from.r,chosen.from.c,chosen);
}

function checkEnd(){
 const opp=turn,caps=allCaptures(opp);let any=caps.length>0;
 if(!any)for(let r=0;r<R.n;r++)for(let c=0;c<R.n;c++)if(board[r][c]?.color===opp&&getMoves(r,c).length){any=true;break}
 let count=0;for(let r=0;r<R.n;r++)for(let c=0;c<R.n;c++)if(board[r][c]?.color===opp)count++;
 if(count===0||!any){
   const redWon = opp==='black';
   if(mode==='ai')sfx(redWon?'win':'lose');else sfx('win');
   document.getElementById('turn').textContent=t('gameOver');
   document.getElementById('status').textContent=redWon?t('redWins'):t('blackWins');
   scheduleGameTask(()=>newGame(),1600);
 }
}

function openRule(k){
 document.getElementById('ruleTitle').textContent=t('rule');
 document.getElementById('ruleText').innerHTML=ruleHTML('brazil');
 show('ruleDetail');
}

function ruleHTML(k){
 return '<h2>'+t('objH')+'</h2><p>'+t('objP')+'</p><h2>'+t('rulesH')+'</h2><ul><li>'+t('r1')+'</li><li>'+t('r2')+'</li><li>'+t('r3')+'</li><li>'+t('r4')+'</li><li>'+t('r5')+'</li></ul>';
}

function confirmMenu(){modalAction=()=>{show('home')};openModal(t('backMenuQ'),t('matchEnds'))}
let modalAction=()=>{};
function openModal(t,p){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=p;document.getElementById('modal').classList.add('show');window._modalAction=modalAction||(()=>{})}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function modalYes(){closeModal();if(window._modalAction)window._modalAction()}
document.addEventListener('click',e=>{if(gamePaused){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('keydown',e=>{if(gamePaused){if(e.key!=='Escape')e.preventDefault();e.stopImmediatePropagation()}},true);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape' && document.getElementById('modal').classList.contains('show'))closeModal()});
window.addEventListener('error',()=>logPlayableError());
window.addEventListener('unhandledrejection',()=>logPlayableError());
bootGame();
